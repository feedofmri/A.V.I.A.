name: avia

x-admin-db: &admin-db postgres://${POSTGRES_USER:-avia_admin}:${POSTGRES_PASSWORD:-avia_admin_dev}@postgres:5432/${POSTGRES_DB:-avia}
x-app-db: &app-db postgres://${APP_DB_USER:-avia_app}:${APP_DB_PASSWORD:-avia_app_dev}@postgres:5432/${POSTGRES_DB:-avia}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avia}
      POSTGRES_USER: ${POSTGRES_USER:-avia_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avia_admin_dev}
      APP_DB_USER: ${APP_DB_USER:-avia_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-avia_app_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # On-board inference service (PyTorch). Reads the ML team's weights, encoder .py files and calibration CSVs
  # read-only from ./model files; healthy only once every model has loaded.
  agent:
    build:
      context: ./agent
      target: runtime
    restart: unless-stopped
    environment:
      AVIA_MODEL_DIR: /models
      TORCH_THREADS: ${TORCH_THREADS:-2}
    volumes:
      - ./model files:/models:ro
    ports:
      - "127.0.0.1:${AGENT_PORT:-8000}:8000"

  # One-shot: applies server/migrations as the database owner, then exits.
  migrate:
    build: ./server
    command: ["node", "dist/db/migrate.js"]
    restart: "no"
    environment:
      ADMIN_DATABASE_URL: *admin-db
      APP_DB_USER: ${APP_DB_USER:-avia_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-avia_app_dev}
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build: ./server
    restart: unless-stopped
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-avia-internal-local-demo-change-before-sharing}
      JOURNAL_KEY: ${JOURNAL_KEY:-avia-local-demo-journal-key-change-before-sharing}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      META_MODEL: ${META_MODEL:-muse-spark-1.3}
      PORT: 3000
      DATABASE_URL: *app-db
      ML_URL: http://agent:8000
    ports:
      - "127.0.0.1:${SERVER_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      agent:
        condition: service_started

  # One-shot, idempotent demo seeder: inserts only what is missing; telemetry runs through the real models.
  seed:
    build: ./server
    command: ["node", "dist/db/seed.js"]
    restart: "no"
    environment:
      DATABASE_URL: *app-db
      ADMIN_DATABASE_URL: *admin-db
      APP_DB_USER: ${APP_DB_USER:-avia_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-avia_app_dev}
      ML_URL: http://agent:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      agent:
        condition: service_healthy

  bff:
    build: ./bff
    restart: unless-stopped
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-avia-internal-local-demo-change-before-sharing}
      DEMO_MODE: ${DEMO_MODE:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:8080,http://localhost:8081}
      AUTH_USERS: ${AUTH_USERS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PORT: 4000
      API_URL: http://server:3000
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-15}
    ports:
      - "127.0.0.1:${BFF_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_healthy

  cockpit:
    build: ./client-cockpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COCKPIT_PORT:-8080}:80"
    depends_on:
      - bff

  pulse:
    build: ./client-pulse
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PULSE_PORT:-8081}:80"
    depends_on:
      - bff

volumes:
  pgdata:
  redisdata:
