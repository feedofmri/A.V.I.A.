server {
  listen 80;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'" always;
  location = /sw.js { add_header Cache-Control "no-cache"; }


  # Pulse calls the documented /api/v1/* contract, served by the BFF.
  location /api/ {
    proxy_pass http://bff:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Same-origin BFF access; the trailing slash strips the /bff prefix.
  location /bff/ {
    proxy_pass http://bff:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
